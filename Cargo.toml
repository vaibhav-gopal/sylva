[package]
name = "sylva"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only OR LicenseRef-Royalty-Free-1.0 OR LicenseRef-Commercial-1.0"
description = "Graphs and trees that remember: general-purpose structures with a versioned op log on top"
repository = "https://github.com/vaibhav-gopal/sylva"
readme = "README.md"
keywords = ["graph", "tree", "event-sourcing", "op-log", "forest"]
categories = ["data-structures", "no-std", "wasm"]
# What the published crate holds: the code, its benchmarks, and the documents a user needs. The rest
# (Tend's design history, agent and CI files) stays in the repository.
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE.md",
    "LICENSES/**",
    "REUSE.toml",
    "SECURITY.md",
    "CONTACT.md",
    "docs/DESIGN.md",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# The standard library. Without it the structures (graph, tree, forest) need only `alloc`, for
# no_std and wasm targets; the log and the knowledge model need it.
std = ["thiserror/std", "serde?/std"]
# Serialization: Graph and Tree (no_std too, with alloc), and what the log and the knowledge model write.
serde = ["dep:serde", "uuid?/serde"]
# Batches, causal order, replay, history with snapshots, batch files and the hash chain.
log = ["std", "dep:uuid", "serde", "dep:serde_json", "dep:sha2", "dep:hex"]
# Ed25519 signatures over batches (domain-separated).
sign = ["log", "dep:ed25519-dalek"]
# The hash chain stored in SQLite.
sqlite = ["log", "dep:rusqlite"]
# Encryption at rest for a stored log (XChaCha20-Poly1305, keys derived per application).
crypt = ["log", "dep:chacha20poly1305", "dep:hmac", "dep:base64"]
# Typed property graphs and catalog trees: schemas, stated/observed facts, references, queries, diagrams.
knowledge = ["std", "dep:uuid", "serde", "dep:serde_json"]
# TypeScript types for the knowledge model (ts-rs).
ts = ["knowledge", "dep:ts-rs"]

[dependencies]
uuid = { version = "1", features = ["v7"], optional = true }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
ed25519-dalek = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
base64 = { version = "0.22", optional = true }
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "serde-json-impl"], optional = true }

[dev-dependencies]
divan = "0.1.21"
serde_json = "1"
tempfile = "3"

[[bench]]
name = "structures"
harness = false

[[bench]]
name = "forest"
harness = false

[[bench]]
name = "log"
harness = false
required-features = ["log"]
